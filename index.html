<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to DerLg to continue planning your next trip.">
    <title>Sign in | DerLg</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand" aria-label="DerLg">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32">
                        <path d="M16 3 5 26l11-5 11 5L16 3Z"></path>
                        <path d="m16 9-4 10 4-2 4 2-4-10Z"></path>
                    </svg>
                </span>
                <span>DerLg</span>
            </div>

            <header class="login-header">
                <p class="eyebrow">Welcome back</p>
                <h1 class="cc">Your next journey starts here.</h1>
                <p>Sign in to keep planning the places you want to explore.</p>
            </header>

            <form action="/index.html" method="post">
                <div class="form-group">
                    <label for="username">Username or email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email"
                        autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <button class="primary-button" type="submit">Sign in</button>

                <div class="divider" aria-hidden="true">
                    <span>or</span>
                </div>

                <button class="google-button" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4.2h5.4a4.6 4.6 0 0 1-2 3v2.7h3.5c2-1.9 3.2-4.6 3.2-7.7Z">
                        </path>
                        <path fill="#34A853"
                            d="M12 22c2.9 0 5.3-1 7-2.6l-3.5-2.7c-.9.6-2.1 1-3.5 1a6.1 6.1 0 0 1-5.7-4.2H2.7v2.8A10 10 0 0 0 12 22Z">
                        </path>
                        <path fill="#FBBC05"
                            d="M6.3 13.5A6 6 0 0 1 6 12c0-.5.1-1 .3-1.5V7.7H2.7A10 10 0 0 0 2 12c0 1.6.4 3 1 4.3l3.3-2.8Z">
                        </path>
                        <path fill="#EA4335"
                            d="M12 6.3c1.6 0 3 .5 4.1 1.6l3.1-3.1A10 10 0 0 0 2.7 7.7l3.6 2.8A6.1 6.1 0 0 1 12 6.3Z">
                        </path>
                    </svg>
                    Continue with Google
                </button>
            </form>
        </section>
    </main>
</body>

</html>
